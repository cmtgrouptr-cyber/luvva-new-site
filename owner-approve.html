<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUVVA Owner Verification</title><style>:root{--g:#d6b36d;--bg:#070b10;--p:#111922;--t:#f5ead7;--m:#a99d8a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1b2530,#070b10 55%);font-family:Arial;color:var(--t);padding:20px}.card{width:min(430px,100%);background:linear-gradient(145deg,#121a23,#090e14);border:1px solid #705938;border-radius:24px;padding:28px;box-shadow:0 30px 80px #000b;text-align:center}h1{font-family:Georgia;color:var(--g);font-size:25px;margin:0 0 8px}p{color:var(--m);line-height:1.6}.type{margin:18px 0;padding:14px;border:1px solid #4f402b;border-radius:14px;color:#f0d79f}input{width:100%;padding:14px;background:#080d12;border:1px solid #665236;border-radius:12px;color:white;text-align:center;font-size:20px;letter-spacing:5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{padding:13px;border-radius:12px;border:1px solid #6d5838;background:#151d26;color:white;font-weight:700}button.ok{background:linear-gradient(#d8b773,#9a7539);color:#171108}.status{min-height:24px;margin-top:14px;color:#e1bf7b}</style></head><body><main class="card"><h1>LUVVA Secure Owner Verification</h1><p>Confirm this request only if you initiated it from the gateway.</p><div class="type" id="type">Loading request…</div><input id="pin" type="password" inputmode="numeric" placeholder="Owner PIN" maxlength="12"><div class="buttons"><button id="deny">Deny</button><button class="ok" id="approve">Approve</button></div><div class="status" id="status"></div></main><script>const q=new URLSearchParams(location.search),t=q.get('t'),$=id=>document.getElementById(id);async function status(){try{const r=await fetch('/api/owner-challenge-status?t='+encodeURIComponent(t));const j=await r.json();if(!j.ok)throw 0;$('type').textContent=j.access_type==='dashboard'?'Dashboard Access':'Website Access';if(j.status!=='pending'){$('status').textContent='Request is '+j.status+'.';$('approve').disabled=$('deny').disabled=true}}catch{$('status').textContent='Unable to load or request expired.'}}async function decide(decision){$('status').textContent='Processing…';try{const r=await fetch('/api/owner-challenge-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,pin:$('pin').value,decision})});const j=await r.json();if(!j.ok)throw new Error(j.message||'Request failed');$('status').textContent=decision==='approve'?'Approved. Return to the requesting device.':'Request denied.';$('approve').disabled=$('deny').disabled=true}catch(e){$('status').textContent=e.message}}$('approve').onclick=()=>decide('approve');$('deny').onclick=()=>decide('deny');status();</script></body></html>
