<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUVVA Owner Verification</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>:root{--g:#d6b36d;--bg:#070b10;--p:#111922;--t:#f5ead7;--m:#a99d8a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1b2530,#070b10 55%);font-family:Arial;color:var(--t);padding:20px}.card{width:min(430px,100%);background:linear-gradient(145deg,#121a23,#090e14);border:1px solid #705938;border-radius:24px;padding:28px;box-shadow:0 30px 80px #000b;text-align:center}h1{font-family:Georgia;color:var(--g);font-size:25px;margin:0 0 8px}p{color:var(--m);line-height:1.6}.type{margin:18px 0;padding:14px;border:1px solid #4f402b;border-radius:14px;color:#f0d79f}.google{display:grid;place-items:center;min-height:44px}.code{display:none;margin-top:18px;padding:18px;border:1px solid #6b5637;border-radius:16px;background:#090e14}.code.show{display:block}.digits{font-size:34px;letter-spacing:8px;color:#f4d28d;font-weight:800;margin:8px 0}.status{min-height:24px;margin-top:14px;color:#e1bf7b}.small{font-size:12px}</style></head><body><main class="card"><h1>LUVVA Secure Owner Verification</h1><p>Continue only if you initiated this request from the LUVVA gateway.</p><div class="type" id="type">Loading secure request…</div><div class="google" id="googleButton"></div><div class="code" id="codeBox"><div class="small">Enter this one-time code on the requesting device:</div><div class="digits" id="digits">------</div><div class="small">Do not share this code. It is valid for 60 seconds after Google approval.</div></div><div class="status" id="status"></div></main><script>
const q=new URLSearchParams(location.search),t=q.get('t'),$=id=>document.getElementById(id);let cfg=null,ready=false;
async function load(){try{if(!t)throw new Error('Missing request');const [sr,cr]=await Promise.all([fetch('/api/owner-challenge-status?t='+encodeURIComponent(t),{cache:'no-store'}),fetch('/api/public-config',{cache:'no-store'})]);const s=await sr.json(),c=await cr.json();if(!sr.ok||!s.ok)throw new Error(s.message||'Unable to load request');if(!cr.ok||!c.ok||!c.googleClientId)throw new Error('Google configuration is unavailable');if(s.status!=='pending')throw new Error(s.status==='expired'?'This request has expired.':'This request is no longer pending.');$('type').textContent=s.access_type==='dashboard'?'Dashboard Access':'Website Access';cfg=c;initGoogle()}catch(e){$('status').textContent=e.message}}
function initGoogle(){if(!window.google?.accounts?.id){setTimeout(initGoogle,150);return}if(ready)return;ready=true;google.accounts.id.initialize({client_id:cfg.googleClientId,callback:onGoogle,auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:300})}
async function onGoogle(response){$('status').textContent='Verifying authorized Google account…';try{const r=await fetch('/api/owner-challenge-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,credential:response.credential})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'Verification failed');$('googleButton').style.display='none';$('digits').textContent=j.verification_code;$('codeBox').classList.add('show');$('status').textContent='Google owner verified. Use the code on the requesting device.'}catch(e){$('status').textContent=e.message}}
load();
</script></body></html>
